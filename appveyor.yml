init:
  - git config --global core.autocrlf true
branches:
  only:
    - master
    - release
    - dev
    - /^(.*\/)?ci-.*$/
build_script:
  - build.cmd --quiet --parallel verify

on_success:
  - packages\coveralls.io\tools\coveralls.net --opencover "artifacts\coverage.xml" --full-sources
clone_depth: 1
artifacts:
  - path: 'artifacts\build\*.nupkg'
    name: Nuget Packages
test: off
deploy: off
