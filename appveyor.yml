init:
  - git config --global core.autocrlf true
branches:
  only:
    - master
    - release
    - dev
    - /^(.*\/)?ci-.*$/
build_script:
  - build.cmd verify
clone_depth: 1
test: off
deploy:
  provider: NuGet
  api_key:
    secure: a64tpTcjM136tzlZKiwMQcq7F4XxuvKfXIXbTNPvorIssrN7qszCFfkTWRYtskT2
  skip_symbols: false
  artifact: /artifacts/.*\.nupkg/
